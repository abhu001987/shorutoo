<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taj Mahal Puzzle</title>
    
    <!-- ===== STYLES ===== -->
    <style>
        /* All CSS goes here - we'll customize it */
        
        /* Dark theme matching your site */
        body {
            background: #0d0d1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .puzzle-card {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 24px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
            overflow: hidden;
        }
        
        /* ===== HEADER ===== */
        .puzzle-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .puzzle-title {
            color: #ffffff;
            font-size: 22px;
            font-weight: 700;
        }
        
        .puzzle-title span {
            color: #ff6b35;
        }
        
        .puzzle-stats {
            color: #8888aa;
            font-size: 13px;
            display: flex;
            gap: 16px;
        }
        
        /* ===== PUZZLE CONTAINER ===== */
        .puzzle-container {
            position: relative;
            background: #0a0a18;
            border-radius: 14px;
            overflow: hidden;
            aspect-ratio: 4 / 3;
            border: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
        }
        
        /* ===== PUZZLE OVERLAY (Play Button) ===== */
        .puzzle-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.5s ease;
            border-radius: 14px;
        }
        
        .puzzle-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .puzzle-overlay .preview-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            inset: 0;
            opacity: 0.6;
        }
        
        .puzzle-overlay .content {
            position: relative;
            z-index: 2;
            text-align: center;
        }
        
        .puzzle-overlay h2 {
            color: #ffffff;
            font-size: 32px;
            font-weight: 800;
            margin: 0 0 8px 0;
            text-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }
        
        .puzzle-overlay p {
            color: #aaaacc;
            font-size: 16px;
            margin: 0 0 20px 0;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        
        .play-button {
            padding: 16px 48px;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(255, 107, 53, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }
        
        .play-button:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 40px rgba(255, 107, 53, 0.6);
        }
        
        .play-button:active {
            transform: scale(0.95);
        }
        
        /* ===== PUZZLE CANVAS (Hidden initially) ===== */
        #puzzleCanvas {
            width: 100%;
            height: 100%;
            display: none;
            background: #0a0a18;
            touch-action: none;
        }
        
        #puzzleCanvas.active {
            display: block;
            cursor: grab;
        }
        
        #puzzleCanvas.active:active {
            cursor: grabbing;
        }
        
        /* ===== STATUS BAR ===== */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            margin-top: 14px;
            border: 1px solid rgba(255,255,255,0.04);
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .status-item {
            color: #8888aa;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .status-item .value {
            color: #ffffff;
            font-weight: 700;
        }
        
        .progress-track {
            flex: 1;
            height: 4px;
            background: rgba(255,255,255,0.06);
            border-radius: 4px;
            overflow: hidden;
            min-width: 60px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b35, #f7931e);
            border-radius: 4px;
            transition: width 0.3s ease;
            width: 0%;
        }
        
        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            .puzzle-card {
                padding: 16px;
            }
            .puzzle-title {
                font-size: 18px;
            }
            .puzzle-overlay h2 {
                font-size: 24px;
            }
            .play-button {
                padding: 12px 32px;
                font-size: 16px;
            }
            .status-bar {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>

<div class="puzzle-card">
    <!-- ===== HEADER ===== -->
    <div class="puzzle-header">
        <div class="puzzle-title">
            🏛️ <span>Taj Mahal</span> Puzzle
        </div>
        <div class="puzzle-stats">
            <span>🧩 24 pieces</span>
            <span>⭐ 4.8</span>
        </div>
    </div>
    
    <!-- ===== PUZZLE ===== -->
    <div class="puzzle-container" id="puzzleContainer">
        <!-- OVERLAY with Play Button -->
        <div class="puzzle-overlay" id="puzzleOverlay">
            <img src="https://picsum.photos/800/600?random=taj" 
                 alt="Taj Mahal" 
                 class="preview-image">
            <div class="content">
                <h2>🧩 Complete the Puzzle</h2>
                <p>Drag pieces to reconstruct the image</p>
                <button class="play-button" id="playButton">
                    ▶ Play Now
                </button>
            </div>
        </div>
        
        <!-- Canvas for the puzzle -->
        <canvas id="puzzleCanvas"></canvas>
    </div>
    
    <!-- ===== STATUS BAR ===== -->
    <div class="status-bar" id="statusBar" style="display:none;">
        <div class="status-item">
            ⏱️ <span class="value" id="timerDisplay">0:00</span>
        </div>
        <div class="status-item">
            🧩 <span class="value" id="pieceCount">0/24</span>
        </div>
        <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="status-item">
            <span class="value" id="progressLabel">0%</span>
        </div>
        <button onclick="shufflePieces()" style="background:rgba(255,255,255,0.05);border:none;color:#aaaacc;padding:4px 12px;border-radius:6px;cursor:pointer;font-size:13px;">
            🔀 Shuffle
        </button>
    </div>
</div>

<!-- ================================================================ -->
<!-- JAVASCRIPT - Simplified Puzzle Engine from grrd's Puzzle         -->
<!-- ================================================================ -->
<script>
// ============================================================
// 🧩 SIMPLIFIED PUZZLE ENGINE (Based on grrd's Puzzle)
// ============================================================

// ---- CONFIG ----
const ROWS = 4;
const COLS = 6;
const TOTAL_PIECES = ROWS * COLS;

// ---- DOM Elements ----
const canvas = document.getElementById('puzzleCanvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('puzzleOverlay');
const playBtn = document.getElementById('playButton');
const statusBar = document.getElementById('statusBar');
const timerDisplay = document.getElementById('timerDisplay');
const pieceCount = document.getElementById('pieceCount');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');

// ---- State ----
let pieces = [];
let selectedPiece = null;
let isDragging = false;
let dragOffX = 0, dragOffY = 0;
let puzzleSolved = false;
let timerSeconds = 0;
let timerInterval = null;
let timerRunning = false;
let imageLoaded = false;
let moves = 0;
let puzzleImage = null;

// ---- Image ----
// Replace this with YOUR Taj Mahal image URL
const IMAGE_URL = 'https://picsum.photos/800/600?random=taj';

// ============================================================
// SETUP CANVAS SIZE
// ============================================================

function setupCanvas() {
    const container = document.getElementById('puzzleContainer');
    const rect = container.getBoundingClientRect();
    const width = rect.width - 4; // padding
    const height = width * 0.75; // 4:3 aspect ratio
    
    canvas.width = 800;
    canvas.height = 600;
    canvas.style.width = '100%';
    canvas.style.height = '100%';
}

// ============================================================
// DRAW PUZZLE PIECE WITH TABS
// ============================================================

function drawPieceShape(ctx, x, y, w, h, tabs) {
    const ts = Math.min(w, h) * 0.22;
    const cs = ts * 0.6;

    ctx.beginPath();
    ctx.moveTo(x, y);

    // Top
    if (tabs[0] === 0) ctx.lineTo(x + w, y);
    else {
        const mid = x + w / 2;
        const dir = tabs[0];
        ctx.quadraticCurveTo(x + w * 0.25, y - dir * ts, mid, y + dir * cs);
        ctx.quadraticCurveTo(x + w * 0.75, y + dir * ts, x + w, y);
    }

    // Right
    if (tabs[1] === 0) ctx.lineTo(x + w, y + h);
    else {
        const mid = y + h / 2;
        const dir = tabs[1];
        ctx.quadraticCurveTo(x + w + dir * ts, y + h * 0.25, x + w - dir * cs, mid);
        ctx.quadraticCurveTo(x + w - dir * ts, y + h * 0.75, x + w, y + h);
    }

    // Bottom
    if (tabs[2] === 0) ctx.lineTo(x, y + h);
    else {
        const mid = x + w / 2;
        const dir = tabs[2];
        ctx.quadraticCurveTo(x + w * 0.75, y + h + dir * ts, mid, y + h - dir * cs);
        ctx.quadraticCurveTo(x + w * 0.25, y + h - dir * ts, x, y + h);
    }

    // Left
    if (tabs[3] === 0) ctx.closePath();
    else {
        const mid = y + h / 2;
        const dir = tabs[3];
        ctx.quadraticCurveTo(x - dir * ts, y + h * 0.75, x + dir * cs, mid);
        ctx.quadraticCurveTo(x + dir * ts, y + h * 0.25, x, y);
        ctx.closePath();
    }
}

// ============================================================
// GENERATE PIECES
// ============================================================

function generatePieces() {
    const W = canvas.width, H = canvas.height;
    const pw = W / COLS, ph = H / ROWS;

    // Random tabs
    const tabs = [];
    for (let r = 0; r < ROWS; r++) {
        tabs[r] = [];
        for (let c = 0; c < COLS; c++) {
            tabs[r][c] = [
                r === 0 ? 0 : (Math.random() > 0.5 ? 1 : -1),
                c === COLS - 1 ? 0 : (Math.random() > 0.5 ? 1 : -1),
                r === ROWS - 1 ? 0 : (Math.random() > 0.5 ? 1 : -1),
                c === 0 ? 0 : (Math.random() > 0.5 ? 1 : -1)
            ];
        }
    }

    // Match adjacent pieces
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            if (c < COLS - 1 && tabs[r][c][1] !== 0 && tabs[r][c + 1][3] !== 0) {
                tabs[r][c + 1][3] = -tabs[r][c][1];
            }
            if (r < ROWS - 1 && tabs[r][c][2] !== 0 && tabs[r + 1][c][0] !== 0) {
                tabs[r + 1][c][0] = -tabs[r][c][2];
            }
        }
    }

    const result = [];
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            result.push({
                id: r * COLS + c,
                row: r, col: c,
                correctX: c * pw, correctY: r * ph,
                currentX: 0, currentY: 0,
                width: pw, height: ph,
                tabs: tabs[r][c],
                isPlaced: false,
                imageData: null
            });
        }
    }
    return result;
}

// ============================================================
// RENDER PIECE IMAGES
// ============================================================

function renderPieceImages(img, piecesArray) {
    const pw = canvas.width / COLS;
    const ph = canvas.height / ROWS;

    piecesArray.forEach(p => {
        const off = document.createElement('canvas');
        off.width = pw;
        off.height = ph;
        const octx = off.getContext('2d');

        octx.drawImage(img, p.correctX, p.correctY, pw, ph, 0, 0, pw, ph);

        // Mask with shape
        const mask = document.createElement('canvas');
        mask.width = pw;
        mask.height = ph;
        const mctx = mask.getContext('2d');
        drawPieceShape(mctx, 0, 0, pw, ph, p.tabs);
        mctx.fillStyle = 'white';
        mctx.fill();

        octx.globalCompositeOperation = 'destination-in';
        octx.drawImage(mask, 0, 0);
        octx.globalCompositeOperation = 'source-over';

        p.imageData = off.toDataURL();
    });
}

// ============================================================
// DRAW PUZZLE
// ============================================================

function drawPuzzle() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Background
    ctx.fillStyle = '#0a0a18';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const sorted = [...pieces];
    if (selectedPiece && isDragging) {
        const idx = sorted.indexOf(selectedPiece);
        if (idx > -1) { sorted.splice(idx, 1); sorted.push(selectedPiece); }
    }

    sorted.forEach(p => {
        if (!p.imageData) return;
        const img = new Image();
        img.src = p.imageData;

        ctx.drawImage(img, p.currentX, p.currentY, p.width, p.height);

        // Border
        ctx.strokeStyle = p.isPlaced ? 'rgba(76,175,80,0.3)' : 'rgba(255,255,255,0.06)';
        ctx.lineWidth = 1.5;
        drawPieceShape(ctx, p.currentX, p.currentY, p.width, p.height, p.tabs);
        ctx.stroke();

        // Selected highlight
        if (p === selectedPiece && isDragging) {
            ctx.shadowColor = 'rgba(255,107,53,0.4)';
            ctx.shadowBlur = 25;
            ctx.strokeStyle = '#ff6b35';
            ctx.lineWidth = 3;
            drawPieceShape(ctx, p.currentX, p.currentY, p.width, p.height, p.tabs);
            ctx.stroke();
            ctx.shadowBlur = 0;
        }
    });
}

// ============================================================
// SHUFFLE
// ============================================================

function shufflePiecesArray() {
    const W = canvas.width, H = canvas.height;
    pieces.forEach(p => {
        p.currentX = Math.random() * (W - p.width);
        p.currentY = Math.random() * (H - p.height);
        p.isPlaced = false;
    });
    puzzleSolved = false;
    moves = 0;
    updateProgress();
    drawPuzzle();
}

function shufflePieces() {
    if (!imageLoaded) return;
    shufflePiecesArray();
}

// ============================================================
// TIMER
// ============================================================

function startTimer() {
    if (timerRunning) return;
    timerRunning = true;
    timerInterval = setInterval(() => {
        timerSeconds++;
        const m = Math.floor(timerSeconds / 60);
        const s = timerSeconds % 60;
        timerDisplay.textContent = m + ':' + String(s).padStart(2, '0');
    }, 1000);
}

function stopTimer() {
    timerRunning = false;
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

function resetTimer() {
    timerSeconds = 0;
    timerDisplay.textContent = '0:00';
}

// ============================================================
// PROGRESS
// ============================================================

function updateProgress() {
    const placed = pieces.filter(p => p.isPlaced).length;
    const pct = Math.round((placed / TOTAL_PIECES) * 100);
    progressFill.style.width = pct + '%';
    progressLabel.textContent = pct + '%';
    pieceCount.textContent = placed + '/' + TOTAL_PIECES;
}

// ============================================================
// DRAG & DROP
// ============================================================

function getPieceAt(x, y) {
    for (let i = pieces.length - 1; i >= 0; i--) {
        const p = pieces[i];
        if (p.isPlaced) continue;
        if (x >= p.currentX && x <= p.currentX + p.width &&
            y >= p.currentY && y <= p.currentY + p.height) {
            return p;
        }
    }
    return null;
}

function onPointerDown(e) {
    if (puzzleSolved || !imageLoaded) return;
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;

    const cx = e.clientX || e.touches?.[0]?.clientX || 0;
    const cy = e.clientY || e.touches?.[0]?.clientY || 0;

    const mx = (cx - rect.left) * scaleX;
    const my = (cy - rect.top) * scaleY;

    const p = getPieceAt(mx, my);
    if (p) {
        selectedPiece = p;
        isDragging = true;
        dragOffX = mx - p.currentX;
        dragOffY = my - p.currentY;
        if (!timerRunning && !puzzleSolved) startTimer();
        drawPuzzle();
    }
}

function onPointerMove(e) {
    if (!isDragging || !selectedPiece || puzzleSolved) return;
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;

    const cx = e.clientX || e.touches?.[0]?.clientX || 0;
    const cy = e.clientY || e.touches?.[0]?.clientY || 0;

    let mx = (cx - rect.left) * scaleX;
    let my = (cy - rect.top) * scaleY;

    selectedPiece.currentX = Math.max(0, Math.min(canvas.width - selectedPiece.width, mx - dragOffX));
    selectedPiece.currentY = Math.max(0, Math.min(canvas.height - selectedPiece.height, my - dragOffY));
    drawPuzzle();
}

function onPointerUp(e) {
    if (isDragging && selectedPiece) {
        const p = selectedPiece;
        const threshold = 30;

        if (Math.abs(p.currentX - p.correctX) < threshold &&
            Math.abs(p.currentY - p.correctY) < threshold) {
            p.currentX = p.correctX;
            p.currentY = p.correctY;
            p.isPlaced = true;
            moves++;
            updateProgress();

            if (pieces.filter(pc => pc.isPlaced).length === TOTAL_PIECES) {
                puzzleSolved = true;
                stopTimer();
                // Show celebration
                setTimeout(() => {
                    alert('🎉 Puzzle Complete! You solved it in ' + timerDisplay.textContent + '!');
                }, 300);
            }
        }

        isDragging = false;
        selectedPiece = null;
        drawPuzzle();
    }
}

// ---- Events ----
canvas.addEventListener('mousedown', onPointerDown);
window.addEventListener('mousemove', onPointerMove);
window.addEventListener('mouseup', onPointerUp);
canvas.addEventListener('touchstart', e => { e.preventDefault(); onPointerDown(e); }, { passive: false });
canvas.addEventListener('touchmove', e => { e.preventDefault(); onPointerMove(e); }, { passive: false });
canvas.addEventListener('touchend', e => { e.preventDefault(); onPointerUp(e); }, { passive: false });

// ============================================================
// LOAD IMAGE & INIT
// ============================================================

function loadImage(url) {
    return new Promise(resolve => {
        const img = new Image();
        img.crossOrigin = 'Anonymous';
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = url;
    });
}

async function initPuzzle(imgUrl) {
    const img = await loadImage(imgUrl);
    if (!img) {
        alert('Failed to load image. Please check the URL.');
        return;
    }

    puzzleImage = img;
    imageLoaded = true;

    setupCanvas();
    pieces = generatePieces();
    renderPieceImages(img, pieces);

    const W = canvas.width, H = canvas.height;
    pieces.forEach(p => {
        p.currentX = Math.random() * (W - p.width);
        p.currentY = Math.random() * (H - p.height);
        p.isPlaced = false;
    });

    puzzleSolved = false;
    resetTimer();
    timerRunning = false;
    updateProgress();
    drawPuzzle();
}

// ============================================================
// PLAY BUTTON - Start the Game
// ============================================================

playBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    
    // Hide overlay
    overlay.classList.add('hidden');
    
    // Show canvas and status bar
    canvas.classList.add('active');
    statusBar.style.display = 'flex';
    
    // Load and init puzzle if not already loaded
    if (!imageLoaded) {
        initPuzzle(IMAGE_URL);
    } else {
        // Shuffle existing pieces
        shufflePiecesArray();
        resetTimer();
        timerRunning = false;
    }
});

// Also allow clicking the container to start
document.getElementById('puzzleContainer').addEventListener('click', function(e) {
    if (e.target === this || e.target.closest('.puzzle-overlay')) {
        if (!overlay.classList.contains('hidden')) {
            playBtn.click();
        }
    }
});

// ============================================================
// RESIZE HANDLER
// ============================================================

window.addEventListener('resize', () => {
    if (imageLoaded) {
        setupCanvas();
        drawPuzzle();
    }
});

// ============================================================
// START
// ============================================================

console.log('🧩 Taj Mahal Puzzle loaded!');
console.log('Click "Play Now" to start!');

// Preload the image in background
loadImage(IMAGE_URL).then(img => {
    if (img) {
        puzzleImage = img;
        imageLoaded = true;
        setupCanvas();
        pieces = generatePieces();
        renderPieceImages(img, pieces);
        const W = canvas.width, H = canvas.height;
        pieces.forEach(p => {
            p.currentX = Math.random() * (W - p.width);
            p.currentY = Math.random() * (H - p.height);
            p.isPlaced = false;
        });
        updateProgress();
        drawPuzzle();
        console.log('✅ Puzzle preloaded successfully!');
    }
});
</script>

</body>
</html>
