<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧩 Premium Jigsaw Puzzle</title>
    <style>
        /* ============================================================
           PREMIUM DESIGN - Jigsaw Planet Quality
           ============================================================ */

        /* ----- RESET & BASE ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d0d1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            padding: 20px;
        }

        /* ----- MAIN APP CONTAINER ----- */
        .puzzle-app {
            background: #1a1a2e;
            border-radius: 24px;
            padding: 28px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.04);
            transition: all 0.3s ease;
        }

        /* ----- TOP BAR: Breadcrumb + Actions ----- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #6a6a8a;
            font-size: 13px;
            font-weight: 500;
        }

        .breadcrumb a {
            color: #6a6a8a;
            text-decoration: none;
            transition: color 0.2s;
        }

        .breadcrumb a:hover {
            color: #ff6b35;
        }

        .breadcrumb .current {
            color: #ffffff;
        }

        .breadcrumb .sep {
            color: #3a3a5a;
        }

        .top-actions {
            display: flex;
            gap: 8px;
        }

        .top-actions button {
            padding: 7px 16px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            background: rgba(255, 255, 255, 0.06);
            color: #9a9abc;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .top-actions button:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .top-actions .btn-play {
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            color: #fff;
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
        }

        .top-actions .btn-play:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 107, 53, 0.5);
        }

        /* ----- PUZZLE TITLE ----- */
        .puzzle-title-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .puzzle-title {
            color: #ffffff;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .puzzle-title .sub {
            color: #6a6a8a;
            font-weight: 400;
            font-size: 16px;
            margin-left: 10px;
        }

        .puzzle-meta {
            color: #6a6a8a;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .puzzle-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ----- PUZZLE CANVAS ----- */
        .puzzle-wrapper {
            position: relative;
            background: #0a0a16;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 18px;
            aspect-ratio: 4 / 3;
            min-height: 400px;
            box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.6);
        }

        #puzzleCanvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: grab;
            touch-action: none;
        }

        #puzzleCanvas:active {
            cursor: grabbing;
        }

        /* ----- SOLVED OVERLAY ----- */
        .solved-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            border-radius: 16px;
            animation: fadeIn 0.6s ease;
        }

        .solved-overlay.show {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .solved-overlay .trophy {
            font-size: 72px;
            margin-bottom: 8px;
            animation: bounce 1.2s ease infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-16px); }
        }

        .solved-overlay h2 {
            font-size: 38px;
            font-weight: 800;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .solved-overlay p {
            color: #8a8aaa;
            font-size: 18px;
            margin-top: 4px;
        }

        .solved-overlay .time-result {
            color: #ffffff;
            font-size: 22px;
            font-weight: 600;
            margin-top: 6px;
        }

        /* ----- STATUS BAR (Premium) ----- */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-wrap: wrap;
            gap: 12px;
        }

        .status-group {
            display: flex;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #8a8aaa;
            font-size: 13px;
            font-weight: 500;
        }

        .status-item .icon {
            font-size: 18px;
        }

        .status-item .value {
            color: #ffffff;
            font-weight: 700;
            font-size: 16px;
        }

        .status-item .value.gold {
            color: #f7931e;
        }

        .progress-section {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
            min-width: 120px;
        }

        .progress-track {
            flex: 1;
            height: 6px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            overflow: hidden;
            min-width: 60px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b35, #f7931e);
            border-radius: 4px;
            transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            width: 0%;
            box-shadow: 0 0 20px rgba(255, 107, 53, 0.2);
        }

        .progress-label {
            color: #ffffff;
            font-weight: 700;
            font-size: 15px;
            min-width: 44px;
            text-align: right;
        }

        /* ----- CONTROLS (Premium) ----- */
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .controls button {
            padding: 10px 24px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #bbbbdd;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .controls button:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.10);
            color: #ffffff;
        }

        .controls .primary {
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            color: #fff;
            border: none;
            box-shadow: 0 4px 20px rgba(255, 107, 53, 0.25);
        }

        .controls .primary:hover {
            box-shadow: 0 8px 35px rgba(255, 107, 53, 0.45);
            transform: translateY(-2px);
        }

        .controls .success {
            background: #1b5e20;
            color: #fff;
            border: none;
        }

        .controls .success:hover {
            background: #2e7d32;
            box-shadow: 0 8px 30px rgba(27, 94, 32, 0.4);
        }

        .controls .danger {
            background: #b71c1c;
            color: #fff;
            border: none;
        }

        .controls .danger:hover {
            background: #c62828;
            box-shadow: 0 8px 30px rgba(183, 28, 28, 0.4);
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 640px) {
            .puzzle-app {
                padding: 16px;
                border-radius: 16px;
            }

            .top-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .top-actions {
                justify-content: stretch;
            }

            .top-actions button {
                flex: 1;
                justify-content: center;
                padding: 8px 12px;
                font-size: 12px;
            }

            .puzzle-title {
                font-size: 20px;
            }

            .puzzle-title .sub {
                font-size: 13px;
                display: block;
                margin-left: 0;
            }

            .puzzle-meta {
                font-size: 12px;
                gap: 10px;
            }

            .status-bar {
                flex-direction: column;
                align-items: stretch;
                padding: 12px 16px;
            }

            .status-group {
                justify-content: space-between;
            }

            .progress-section {
                min-width: unset;
            }

            .controls button {
                flex: 1;
                justify-content: center;
                padding: 8px 14px;
                font-size: 12px;
            }

            .solved-overlay h2 {
                font-size: 26px;
            }

            .solved-overlay .trophy {
                font-size: 52px;
            }
        }

        @media (max-width: 400px) {
            .status-group {
                gap: 12px;
                flex-wrap: wrap;
            }

            .status-item {
                font-size: 12px;
            }

            .status-item .value {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

<div class="puzzle-app">
    <!-- ===== TOP BAR ===== -->
    <div class="top-bar">
        <div class="breadcrumb">
            <a href="#">My Puzzles</a>
            <span class="sep">›</span>
            <a href="#">Nature</a>
            <span class="sep">›</span>
            <a href="#">Mountains</a>
            <span class="sep">›</span>
            <span class="current">24</span>
        </div>
        <div class="top-actions">
            <button class="btn-play" onclick="shufflePieces()">▶ Play</button>
            <button onclick="sharePuzzle()">📤 Share</button>
            <button onclick="editPuzzle()">✏️ Edit</button>
        </div>
    </div>

    <!-- ===== TITLE ===== -->
    <div class="puzzle-title-section">
        <div class="puzzle-title">
            🏔️ Alpine Lake
            <span class="sub">• 24 pieces</span>
        </div>
        <div class="puzzle-meta">
            <span>⭐ 4.8</span>
            <span>👤 1.2k played</span>
        </div>
    </div>

    <!-- ===== PUZZLE ===== -->
    <div class="puzzle-wrapper">
        <canvas id="puzzleCanvas" width="800" height="600"></canvas>
        <div class="solved-overlay" id="overlay">
            <div class="trophy">🏆</div>
            <h2>Puzzle Complete!</h2>
            <p>You solved it in</p>
            <div class="time-result" id="finalTime">0:00</div>
        </div>
    </div>

    <!-- ===== STATUS BAR ===== -->
    <div class="status-bar">
        <div class="status-group">
            <div class="status-item">
                <span class="icon">🧩</span>
                <span>Pieces</span>
                <span class="value" id="piecesCount">0/24</span>
            </div>
            <div class="status-item">
                <span class="icon">⏱️</span>
                <span class="value" id="timerDisplay">0:00</span>
            </div>
            <div class="status-item">
                <span class="icon">📊</span>
                <span>Moves</span>
                <span class="value" id="movesCount">0</span>
            </div>
        </div>
        <div class="progress-section">
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="progress-label" id="progressLabel">0%</span>
        </div>
    </div>

    <!-- ===== CONTROLS ===== -->
    <div class="controls">
        <button class="primary" onclick="shufflePieces()">🔀 Shuffle</button>
        <button onclick="toggleHint()">💡 Hint</button>
        <button onclick="undoMove()">↩️ Undo</button>
        <button class="success" onclick="resetPuzzle()">🔄 New</button>
        <button class="danger" onclick="nextImage()">📷 Change</button>
    </div>
</div>

<script>
    // ================================================================
    // 🧩 PREMIUM JIGSAW PUZZLE ENGINE
    // ================================================================

    // ---- CONFIG ----
    const ROWS = 4;
    const COLS = 6;
    const TOTAL = ROWS * COLS;

    // ---- YOUR IMAGES ----
    const IMAGES = [
        'https://picsum.photos/800/600?random=1',
        'https://picsum.photos/800/600?random=2',
        'https://picsum.photos/800/600?random=3',
        'https://picsum.photos/800/600?random=4',
        'https://picsum.photos/800/600?random=5',
    ];

    let currentImgIdx = 0;

    // ---- DOM ----
    const canvas = document.getElementById('puzzleCanvas');
    const ctx = canvas.getContext('2d');
    const progressFill = document.getElementById('progressFill');
    const progressLabel = document.getElementById('progressLabel');
    const timerDisplay = document.getElementById('timerDisplay');
    const piecesCount = document.getElementById('piecesCount');
    const movesCount = document.getElementById('movesCount');
    const overlay = document.getElementById('overlay');
    const finalTime = document.getElementById('finalTime');

    // ---- STATE ----
    let pieces = [];
    let selectedPiece = null;
    let dragOffX = 0, dragOffY = 0;
    let isDragging = false;
    let puzzleSolved = false;
    let hintMode = false;
    let moves = 0;
    let timerSeconds = 0;
    let timerInterval = null;
    let timerRunning = false;
    let puzzleImage = null;
    let imageLoaded = false;
    let history = []; // for undo

    // ================================================================
    // 🎨 DRAW PUZZLE PIECE WITH TABS
    // ================================================================

    function drawPieceShape(ctx, x, y, w, h, tabs) {
        const ts = Math.min(w, h) * 0.22;
        const cs = ts * 0.6;

        ctx.beginPath();
        ctx.moveTo(x, y);

        // Top
        if (tabs[0] === 0) ctx.lineTo(x + w, y);
        else {
            const mid = x + w / 2;
            const dir = tabs[0];
            ctx.quadraticCurveTo(x + w * 0.25, y - dir * ts, mid, y + dir * cs);
            ctx.quadraticCurveTo(x + w * 0.75, y + dir * ts, x + w, y);
        }

        // Right
        if (tabs[1] === 0) ctx.lineTo(x + w, y + h);
        else {
            const mid = y + h / 2;
            const dir = tabs[1];
            ctx.quadraticCurveTo(x + w + dir * ts, y + h * 0.25, x + w - dir * cs, mid);
            ctx.quadraticCurveTo(x + w - dir * ts, y + h * 0.75, x + w, y + h);
        }

        // Bottom
        if (tabs[2] === 0) ctx.lineTo(x, y + h);
        else {
            const mid = x + w / 2;
            const dir = tabs[2];
            ctx.quadraticCurveTo(x + w * 0.75, y + h + dir * ts, mid, y + h - dir * cs);
            ctx.quadraticCurveTo(x + w * 0.25, y + h - dir * ts, x, y + h);
        }

        // Left
        if (tabs[3] === 0) ctx.closePath();
        else {
            const mid = y + h / 2;
            const dir = tabs[3];
            ctx.quadraticCurveTo(x - dir * ts, y + h * 0.75, x + dir * cs, mid);
            ctx.quadraticCurveTo(x + dir * ts, y + h * 0.25, x, y);
            ctx.closePath();
        }
    }

    // ================================================================
    // 🧩 GENERATE PIECES
    // ================================================================

    function generatePieces() {
        const W = canvas.width, H = canvas.height;
        const pw = W / COLS, ph = H / ROWS;

        // Random tab generation with matching
        const tabs = [];
        for (let r = 0; r < ROWS; r++) {
            tabs[r] = [];
            for (let c = 0; c < COLS; c++) {
                tabs[r][c] = [
                    r === 0 ? 0 : (Math.random() > 0.5 ? 1 : -1),
                    c === COLS - 1 ? 0 : (Math.random() > 0.5 ? 1 : -1),
                    r === ROWS - 1 ? 0 : (Math.random() > 0.5 ? 1 : -1),
                    c === 0 ? 0 : (Math.random() > 0.5 ? 1 : -1)
                ];
            }
        }

        // Match adjacent pieces
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                if (c < COLS - 1 && tabs[r][c][1] !== 0 && tabs[r][c + 1][3] !== 0) {
                    tabs[r][c + 1][3] = -tabs[r][c][1];
                }
                if (r < ROWS - 1 && tabs[r][c][2] !== 0 && tabs[r + 1][c][0] !== 0) {
                    tabs[r + 1][c][0] = -tabs[r][c][2];
                }
            }
        }

        const result = [];
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                result.push({
                    id: r * COLS + c,
                    row: r, col: c,
                    correctX: c * pw, correctY: r * ph,
                    currentX: 0, currentY: 0,
                    width: pw, height: ph,
                    tabs: tabs[r][c],
                    isPlaced: false,
                    imageData: null
                });
            }
        }
        return result;
    }

    // ================================================================
    // 🖼️ RENDER PIECE IMAGES
    // ================================================================

    function renderPieceImages(img, piecesArray) {
        const pw = canvas.width / COLS;
        const ph = canvas.height / ROWS;

        piecesArray.forEach(p => {
            const off = document.createElement('canvas');
            off.width = pw;
            off.height = ph;
            const octx = off.getContext('2d');

            octx.drawImage(img, p.correctX, p.correctY, pw, ph, 0, 0, pw, ph);

            // Mask with shape
            const mask = document.createElement('canvas');
            mask.width = pw;
            mask.height = ph;
            const mctx = mask.getContext('2d');
            drawPieceShape(mctx, 0, 0, pw, ph, p.tabs);
            mctx.fillStyle = 'white';
            mctx.fill();

            octx.globalCompositeOperation = 'destination-in';
            octx.drawImage(mask, 0, 0);
            octx.globalCompositeOperation = 'source-over';

            // Shadow
            octx.shadowColor = 'rgba(0,0,0,0.4)';
            octx.shadowBlur = 12;
            octx.shadowOffsetX = 2;
            octx.shadowOffsetY = 2;
            drawPieceShape(octx, 2, 2, pw - 4, ph - 4, p.tabs);
            octx.shadowColor = 'transparent';

            p.imageData = off.toDataURL();
        });
    }

    // ================================================================
    // 🎨 DRAW PUZZLE
    // ================================================================

    function drawPuzzle() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Background
        const grad = ctx.createRadialGradient(
            canvas.width / 2, canvas.height / 2, 40,
            canvas.width / 2, canvas.height / 2, canvas.width / 1.4
        );
        grad.addColorStop(0, '#1a1a3a');
        grad.addColorStop(1, '#0a0a16');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const sorted = [...pieces];
        if (selectedPiece && isDragging) {
            const idx = sorted.indexOf(selectedPiece);
            if (idx > -1) { sorted.splice(idx, 1);
                sorted.push(selectedPiece); }
        }

        sorted.forEach(p => {
            if (!p.imageData) return;
            const img = new Image();
            img.src = p.imageData;

            ctx.drawImage(img, p.currentX, p.currentY, p.width, p.height);

            // Border
            ctx.strokeStyle = p.isPlaced ? 'rgba(76,175,80,0.3)' : 'rgba(255,255,255,0.06)';
            ctx.lineWidth = 1;
            drawPieceShape(ctx, p.currentX, p.currentY, p.width, p.height, p.tabs);
            ctx.stroke();

            // Hint
            if (hintMode && !p.isPlaced) {
                ctx.strokeStyle = 'rgba(255,107,53,0.2)';
                ctx.lineWidth = 2;
                ctx.setLineDash([6, 6]);
                drawPieceShape(ctx, p.correctX, p.correctY, p.width, p.height, p.tabs);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // Selected highlight
            if (p === selectedPiece && isDragging) {
                ctx.shadowColor = 'rgba(255,107,53,0.4)';
                ctx.shadowBlur = 30;
                ctx.strokeStyle = '#ff6b35';
                ctx.lineWidth = 3;
                drawPieceShape(ctx, p.currentX, p.currentY, p.width, p.height, p.tabs);
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
        });
    }

    // ================================================================
    // 🎲 SHUFFLE
    // ================================================================

    function shufflePiecesArray() {
        const W = canvas.width, H = canvas.height;
        pieces.forEach(p => {
            p.currentX = Math.random() * (W - p.width);
            p.currentY = Math.random() * (H - p.height);
            p.isPlaced = false;
        });
        puzzleSolved = false;
        overlay.classList.remove('show');
        moves = 0;
        movesCount.textContent = '0';
        history = [];
        stopTimer();
        resetTimer();
        timerRunning = false;
        updateProgress();
        drawPuzzle();
    }

    // ================================================================
    // ⏱️ TIMER
    // ================================================================

    function startTimer() {
        if (timerRunning) return;
        timerRunning = true;
        timerInterval = setInterval(() => {
            timerSeconds++;
            const m = Math.floor(timerSeconds / 60);
            const s = timerSeconds % 60;
            timerDisplay.textContent = m + ':' + String(s).padStart(2, '0');
        }, 1000);
    }

    function stopTimer() {
        timerRunning = false;
        if (timerInterval) { clearInterval(timerInterval);
            timerInterval = null; }
    }

    function resetTimer() {
        timerSeconds = 0;
        timerDisplay.textContent = '0:00';
    }

    // ================================================================
    // 📊 PROGRESS
    // ================================================================

    function updateProgress() {
        const placed = pieces.filter(p => p.isPlaced).length;
        const pct = Math.round((placed / TOTAL) * 100);
        progressFill.style.width = pct + '%';
        progressLabel.textContent = pct + '%';
        piecesCount.textContent = placed + '/' + TOTAL;
    }

    // ================================================================
    // 🖱️ DRAG & DROP
    // ================================================================

    function getPieceAt(x, y) {
        for (let i = pieces.length - 1; i >= 0; i--) {
            const p = pieces[i];
            if (p.isPlaced) continue;
            if (x >= p.currentX && x <= p.currentX + p.width &&
                y >= p.currentY && y <= p.currentY + p.height) {
                return p;
            }
        }
        return null;
    }

    function onPointerDown(e) {
        if (puzzleSolved || !imageLoaded) return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        const cx = e.clientX || e.touches?.[0]?.clientX || 0;
        const cy = e.clientY || e.touches?.[0]?.clientY || 0;

        const mx = (cx - rect.left) * scaleX;
        const my = (cy - rect.top) * scaleY;

        const p = getPieceAt(mx, my);
        if (p) {
            selectedPiece = p;
            isDragging = true;
            dragOffX = mx - p.currentX;
            dragOffY = my - p.currentY;
            if (!timerRunning && !puzzleSolved) startTimer();
            drawPuzzle();
        }
    }

    function onPointerMove(e) {
        if (!isDragging || !selectedPiece || puzzleSolved) return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        const cx = e.clientX || e.touches?.[0]?.clientX || 0;
        const cy = e.clientY || e.touches?.[0]?.clientY || 0;

        let mx = (cx - rect.left) * scaleX;
        let my = (cy - rect.top) * scaleY;

        selectedPiece.currentX = Math.max(0, Math.min(canvas.width - selectedPiece.width, mx - dragOffX));
        selectedPiece.currentY = Math.max(0, Math.min(canvas.height - selectedPiece.height, my - dragOffY));
        drawPuzzle();
    }

    function onPointerUp(e) {
        if (isDragging && selectedPiece) {
            const p = selectedPiece;
            const threshold = 30;

            if (Math.abs(p.currentX - p.correctX) < threshold &&
                Math.abs(p.currentY - p.correctY) < threshold) {
                // Save state for undo
                history.push({
                    pieceId: p.id,
                    fromX: p.currentX,
                    fromY: p.currentY,
                    toX: p.correctX,
                    toY: p.correctY
                });

                p.currentX = p.correctX;
                p.currentY = p.correctY;
                p.isPlaced = true;
                moves++;
                movesCount.textContent = moves;
                updateProgress();

                if (pieces.filter(pc => pc.isPlaced).length === TOTAL) {
                    puzzleSolved = true;
                    stopTimer();
                    finalTime.textContent = timerDisplay.textContent;
                    overlay.classList.add('show');
                }
            } else {
                // Record move for undo even if not placed
                history.push({
                    pieceId: p.id,
                    fromX: p.currentX - (p.currentX - p.currentX),
                    fromY: p.currentY - (p.currentY - p.currentY),
                    toX: p.currentX,
                    toY: p.currentY
                });
                // Simplified: we'll just track that a move happened
                moves++;
                movesCount.textContent = moves;
            }

            isDragging = false;
            selectedPiece = null;
            drawPuzzle();
        }
    }

    // ---- Events ----
    canvas.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    canvas.addEventListener('touchstart', e => { e.preventDefault();
        onPointerDown(e); }, { passive: false });
    canvas.addEventListener('touchmove', e => { e.preventDefault();
        onPointerMove(e); }, { passive: false });
    canvas.addEventListener('touchend', e => { e.preventDefault();
        onPointerUp(e); }, { passive: false });

    // ================================================================
    // ↩️ UNDO
    // ================================================================

    function undoMove() {
        if (history.length === 0 || puzzleSolved) return;
        const last = history.pop();
        const p = pieces.find(pc => pc.id === last.pieceId);
        if (p) {
            p.currentX = last.fromX || p.currentX;
            p.currentY = last.fromY || p.currentY;
            p.isPlaced = false;
            moves = Math.max(0, moves - 1);
            movesCount.textContent = moves;
            updateProgress();
            drawPuzzle();
        }
    }

    // ================================================================
    // 🚀 INIT
    // ================================================================

    function loadImage(url) {
        return new Promise(resolve => {
            const img = new Image();
            img.crossOrigin = 'Anonymous';
            img.onload = () => resolve(img);
            img.onerror = () => resolve(null);
            img.src = url;
        });
    }

    async function initPuzzle(imgUrl) {
        const img = await loadImage(imgUrl);
        if (!img) { alert('Failed to load image');
            return; }

        puzzleImage = img;
        imageLoaded = true;

        pieces = generatePieces();
        renderPieceImages(img, pieces);

        const W = canvas.width,
            H = canvas.height;
        pieces.forEach(p => {
            p.currentX = Math.random() * (W - p.width);
            p.currentY = Math.random() * (H - p.height);
            p.isPlaced = false;
        });

        puzzleSolved = false;
        overlay.classList.remove('show');
        moves = 0;
        movesCount.textContent = '0';
        history = [];
        stopTimer();
        resetTimer();
        timerRunning = false;
        updateProgress();
        drawPuzzle();
    }

    // ---- Public ----
    function shufflePieces() {
        if (puzzleSolved) overlay.classList.remove('show');
        shufflePiecesArray();
    }

    function toggleHint() { hintMode = !hintMode;
        drawPuzzle(); }

    function resetPuzzle() {
        if (puzzleSolved) overlay.classList.remove('show');
        shufflePiecesArray();
    }

    function nextImage() {
        currentImgIdx = (currentImgIdx + 1) % IMAGES.length;
        initPuzzle(IMAGES[currentImgIdx]);
    }

    function undoMove() {
        if (history.length === 0 || puzzleSolved) return;
        const last = history.pop();
        const p = pieces.find(pc => pc.id === last.pieceId);
        if (p) {
            p.currentX = last.fromX || p.currentX;
            p.currentY = last.fromY || p.currentY;
            p.isPlaced = false;
            moves = Math.max(0, moves - 1);
            movesCount.textContent = moves;
            updateProgress();
            drawPuzzle();
        }
    }

    function sharePuzzle() {
        if (navigator.share) {
            navigator.share({ title: '🧩 Jigsaw Puzzle', url: window.location.href });
        } else {
            navigator.clipboard.writeText(window.location.href).then(() => {
                alert('Link copied!');
            }).catch(() => alert('Share: ' + window.location.href));
        }
    }

    function editPuzzle() {
        alert('To add your own images, edit the IMAGES array in the JavaScript code.');
    }

    // ---- Expose ----
    window.shufflePieces = shufflePieces;
    window.toggleHint = toggleHint;
    window.resetPuzzle = resetPuzzle;
    window.nextImage = nextImage;
    window.undoMove = undoMove;
    window.sharePuzzle = sharePuzzle;
    window.editPuzzle = editPuzzle;

    // ---- Start ----
    initPuzzle(IMAGES[0]);

    console.log('🧩 Premium Jigsaw Puzzle loaded!');
    console.log('📸 Images:', IMAGES);
    console.log('🔢 Pieces:', TOTAL, '(', ROWS, 'x', COLS, ')');
</script>
