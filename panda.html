<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧩 Real Jigsaw Puzzle</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f0f1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        /* ===== MAIN CONTAINER ===== */
        .puzzle-app {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border-radius: 20px;
            padding: 30px;
            max-width: 850px;
            width: 100%;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* ===== BREADCRUMB ===== */
        .breadcrumb {
            color: #666688;
            font-size: 12px;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .breadcrumb span {
            color: #ff6b35;
        }

        .breadcrumb .sep {
            color: #333355;
            margin: 0 8px;
        }

        /* ===== HEADER ===== */
        .puzzle-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .puzzle-title {
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, #aaaacc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .puzzle-title small {
            -webkit-text-fill-color: #666688;
            font-weight: 400;
            font-size: 14px;
            margin-left: 10px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .header-actions button {
            padding: 8px 18px;
            border: none;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.05);
            color: #8888aa;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header-actions button:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            color: white;
        }

        .header-actions .btn-play {
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            color: white;
            border: none;
        }

        .header-actions .btn-play:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 25px rgba(255, 107, 53, 0.4);
        }

        /* ===== PUZZLE AREA ===== */
        .puzzle-container {
            position: relative;
            background: #0a0a18;
            border-radius: 14px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 18px;
            aspect-ratio: 4 / 3;
            min-height: 420px;
            box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.5);
        }

        #puzzleCanvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: grab;
            touch-action: none;
        }

        #puzzleCanvas:active {
            cursor: grabbing;
        }

        /* ===== OVERLAY (when solved) ===== */
        .puzzle-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            border-radius: 14px;
            animation: fadeIn 0.5s ease;
        }

        .puzzle-overlay.show {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .puzzle-overlay .emoji-big {
            font-size: 64px;
            margin-bottom: 10px;
            animation: bounce 1s ease infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .puzzle-overlay h2 {
            font-size: 36px;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .puzzle-overlay p {
            color: #8888aa;
            font-size: 18px;
        }

        /* ===== STATUS BAR ===== */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 18px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-wrap: wrap;
            gap: 10px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #8888aa;
            font-size: 13px;
        }

        .status-item .icon {
            font-size: 16px;
        }

        .status-item .value {
            color: white;
            font-weight: 700;
            font-size: 15px;
        }

        .progress-wrap {
            flex: 1;
            min-width: 80px;
            height: 5px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b35, #f7931e);
            border-radius: 3px;
            transition: width 0.4s ease;
            width: 0%;
            box-shadow: 0 0 20px rgba(255, 107, 53, 0.3);
        }

        /* ===== CONTROLS ===== */
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .controls button {
            padding: 10px 22px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: #aaaacc;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .controls button:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.1);
        }

        .controls .btn-primary {
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            color: white;
            border: none;
        }

        .controls .btn-primary:hover {
            box-shadow: 0 8px 30px rgba(255, 107, 53, 0.4);
        }

        .controls .btn-success {
            background: #2e7d32;
            color: white;
            border: none;
        }

        .controls .btn-success:hover {
            background: #388e3c;
            box-shadow: 0 8px 30px rgba(46, 125, 50, 0.4);
        }

        .controls .btn-danger {
            background: #c62828;
            color: white;
            border: none;
        }

        .controls .btn-danger:hover {
            background: #d32f2f;
            box-shadow: 0 8px 30px rgba(198, 40, 40, 0.4);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .puzzle-app {
                padding: 16px;
            }
            .puzzle-header {
                flex-direction: column;
                align-items: stretch;
            }
            .header-actions {
                justify-content: stretch;
            }
            .header-actions button {
                flex: 1;
                text-align: center;
            }
            .status-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .controls button {
                flex: 1;
                justify-content: center;
                font-size: 12px;
                padding: 8px 14px;
            }
            .puzzle-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

<div class="puzzle-app">
    <!-- ===== BREADCRUMB ===== -->
    <div class="breadcrumb">
        My Puzzles <span class="sep">›</span>
        <span>Nature</span> <span class="sep">›</span>
        <span>Forest</span> <span class="sep">›</span>
        <span>24</span>
    </div>

    <!-- ===== HEADER ===== -->
    <div class="puzzle-header">
        <div class="puzzle-title">
            🏔️ Mountain Lake <small>• 24 pieces</small>
        </div>
        <div class="header-actions">
            <button class="btn-play" onclick="shufflePieces()">▶ Play</button>
            <button onclick="sharePuzzle()">📤 Share</button>
            <button onclick="editPuzzle()">✏️ Edit</button>
        </div>
    </div>

    <!-- ===== PUZZLE AREA ===== -->
    <div class="puzzle-container">
        <canvas id="puzzleCanvas" width="800" height="600"></canvas>
        <div class="puzzle-overlay" id="overlay">
            <div class="emoji-big">🎉</div>
            <h2>Puzzle Solved!</h2>
            <p>You completed it in <span id="finalTime">0:00</span></p>
        </div>
    </div>

    <!-- ===== STATUS BAR ===== -->
    <div class="status-bar">
        <div class="status-item">
            <span class="icon">🧩</span>
            <span>Progress</span>
            <span class="value" id="progressText">0%</span>
        </div>
        <div class="progress-wrap">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="status-item">
            <span class="icon">⏱️</span>
            <span class="value" id="timerDisplay">0:00</span>
        </div>
        <div class="status-item">
            <span class="icon">📦</span>
            <span class="value" id="piecesCount">0/24</span>
        </div>
    </div>

    <!-- ===== CONTROLS ===== -->
    <div class="controls">
        <button class="btn-primary" onclick="shufflePieces()">🔀 Shuffle</button>
        <button onclick="toggleHint()">💡 Hint</button>
        <button class="btn-success" onclick="resetPuzzle()">🔄 New</button>
        <button class="btn-danger" onclick="nextImage()">📷 Change</button>
    </div>
</div>

<script>
    // ================================================================
    // 🧩 REAL JIGSAW PUZZLE WITH PIECE SHAPES
    // ================================================================

    // ---- CONFIG ----
    const ROWS = 4;
    const COLS = 6;
    const TOTAL = ROWS * COLS;

    // ---- YOUR IMAGES (add your own!) ----
    const IMAGES = [
        'https://picsum.photos/800/600?random=1',
        'https://picsum.photos/800/600?random=2',
        'https://picsum.photos/800/600?random=3',
        'https://picsum.photos/800/600?random=4',
        'https://picsum.photos/800/600?random=5',
    ];

    let currentImgIdx = 0;

    // ---- DOM ----
    const canvas = document.getElementById('puzzleCanvas');
    const ctx = canvas.getContext('2d');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');
    const timerDisplay = document.getElementById('timerDisplay');
    const piecesCount = document.getElementById('piecesCount');
    const overlay = document.getElementById('overlay');
    const finalTime = document.getElementById('finalTime');

    // ---- STATE ----
    let pieces = [];
    let selectedPiece = null;
    let dragOffX = 0, dragOffY = 0;
    let isDragging = false;
    let puzzleSolved = false;
    let hintMode = false;
    let timerSeconds = 0;
    let timerInterval = null;
    let timerRunning = false;
    let puzzleImage = null;
    let imageLoaded = false;

    // ================================================================
    // 🎨 DRAW A PUZZLE PIECE WITH TABS
    // ================================================================

    function drawPieceShape(ctx, x, y, w, h, tabs) {
        // tabs: [top, right, bottom, left] - each is 0 (flat), 1 (tab), -1 (hole)
        const tabSize = Math.min(w, h) * 0.22;
        const curveSize = tabSize * 0.6;

        ctx.beginPath();
        ctx.moveTo(x, y);

        // ---- TOP EDGE ----
        if (tabs[0] === 0) {
            ctx.lineTo(x + w, y);
        } else {
            const mid = x + w / 2;
            const dir = tabs[0];
            // Left half
            ctx.quadraticCurveTo(x + w * 0.25, y - dir * tabSize, mid, y + dir * curveSize);
            // Right half
            ctx.quadraticCurveTo(x + w * 0.75, y + dir * tabSize, x + w, y);
        }

        // ---- RIGHT EDGE ----
        if (tabs[1] === 0) {
            ctx.lineTo(x + w, y + h);
        } else {
            const mid = y + h / 2;
            const dir = tabs[1];
            ctx.quadraticCurveTo(x + w + dir * tabSize, y + h * 0.25, x + w - dir * curveSize, mid);
            ctx.quadraticCurveTo(x + w - dir * tabSize, y + h * 0.75, x + w, y + h);
        }

        // ---- BOTTOM EDGE ----
        if (tabs[2] === 0) {
            ctx.lineTo(x, y + h);
        } else {
            const mid = x + w / 2;
            const dir = tabs[2];
            ctx.quadraticCurveTo(x + w * 0.75, y + h + dir * tabSize, mid, y + h - dir * curveSize);
            ctx.quadraticCurveTo(x + w * 0.25, y + h - dir * tabSize, x, y + h);
        }

        // ---- LEFT EDGE ----
        if (tabs[3] === 0) {
            ctx.closePath();
        } else {
            const mid = y + h / 2;
            const dir = tabs[3];
            ctx.quadraticCurveTo(x - dir * tabSize, y + h * 0.75, x + dir * curveSize, mid);
            ctx.quadraticCurveTo(x + dir * tabSize, y + h * 0.25, x, y);
            ctx.closePath();
        }
    }

    // ================================================================
    // 🧩 GENERATE PUZZLE PIECES WITH RANDOM TABS
    // ================================================================

    function generatePieces() {
        const W = canvas.width;
        const H = canvas.height;
        const pw = W / COLS;
        const ph = H / ROWS;

        // First, generate random tabs for each edge
        // Each piece stores tabs for [top, right, bottom, left]
        const tabMatrix = [];

        for (let r = 0; r < ROWS; r++) {
            tabMatrix[r] = [];
            for (let c = 0; c < COLS; c++) {
                // Random tabs: 1 = tab, -1 = hole, 0 = flat (edge pieces are flat on edges)
                const tabs = [
                    r === 0 ? 0 : (Math.random() > 0.5 ? 1 : -1),  // top
                    c === COLS - 1 ? 0 : (Math.random() > 0.5 ? 1 : -1), // right
                    r === ROWS - 1 ? 0 : (Math.random() > 0.5 ? 1 : -1), // bottom
                    c === 0 ? 0 : (Math.random() > 0.5 ? 1 : -1)   // left
                ];
                tabMatrix[r][c] = tabs;
            }
        }

        // Ensure matching tabs between adjacent pieces
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                // Match with right neighbor (piece's right tab = neighbor's left tab * -1)
                if (c < COLS - 1) {
                    const myRight = tabMatrix[r][c][1];
                    const neighborLeft = tabMatrix[r][c + 1][3];
                    if (myRight !== 0 && neighborLeft !== 0 && myRight !== -neighborLeft) {
                        // Fix mismatch - make them match
                        tabMatrix[r][c + 1][3] = -myRight;
                    }
                }
                // Match with bottom neighbor
                if (r < ROWS - 1) {
                    const myBottom = tabMatrix[r][c][2];
                    const neighborTop = tabMatrix[r + 1][c][0];
                    if (myBottom !== 0 && neighborTop !== 0 && myBottom !== -neighborTop) {
                        tabMatrix[r + 1][c][0] = -myBottom;
                    }
                }
            }
        }

        // Create pieces with their tab patterns
        const newPieces = [];
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                newPieces.push({
                    id: r * COLS + c,
                    row: r,
                    col: c,
                    correctX: c * pw,
                    correctY: r * ph,
                    currentX: 0,
                    currentY: 0,
                    width: pw,
                    height: ph,
                    tabs: tabMatrix[r][c],
                    isPlaced: false,
                    imageData: null // will be set later
                });
            }
        }

        return newPieces;
    }

    // ================================================================
    // 🖼️ RENDER PIECE IMAGES
    // ================================================================

    function renderPieceImages(image, piecesArray) {
        const pw = canvas.width / COLS;
        const ph = canvas.height / ROWS;

        piecesArray.forEach(piece => {
            const offCanvas = document.createElement('canvas');
            offCanvas.width = pw;
            offCanvas.height = ph;
            const offCtx = offCanvas.getContext('2d');

            // Draw the image portion
            offCtx.drawImage(
                image,
                piece.correctX, piece.correctY, pw, ph,
                0, 0, pw, ph
            );

            // Apply clip path for puzzle shape
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = pw;
            tempCanvas.height = ph;
            const tempCtx = tempCanvas.getContext('2d');

            // Draw shape mask
            drawPieceShape(tempCtx, 0, 0, pw, ph, piece.tabs);
            tempCtx.fillStyle = 'white';
            tempCtx.fill();

            // Use the mask to clip the image
            offCtx.globalCompositeOperation = 'destination-in';
            offCtx.drawImage(tempCanvas, 0, 0);
            offCtx.globalCompositeOperation = 'source-over';

            // Add a subtle shadow
            offCtx.shadowColor = 'rgba(0,0,0,0.3)';
            offCtx.shadowBlur = 8;
            offCtx.shadowOffsetX = 2;
            offCtx.shadowOffsetY = 2;
            drawPieceShape(offCtx, 2, 2, pw - 4, ph - 4, piece.tabs);
            offCtx.shadowColor = 'transparent';

            piece.imageData = offCanvas.toDataURL();
        });
    }

    // ================================================================
    // 🎨 DRAW THE PUZZLE
    // ================================================================

    function drawPuzzle() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Background
        const grad = ctx.createRadialGradient(
            canvas.width / 2, canvas.height / 2, 50,
            canvas.width / 2, canvas.height / 2, canvas.width / 1.5
        );
        grad.addColorStop(0, '#1a1a3a');
        grad.addColorStop(1, '#0a0a18');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw each piece
        const sortedPieces = [...pieces];
        if (selectedPiece && isDragging) {
            // Move selected piece to end so it renders on top
            const idx = sortedPieces.indexOf(selectedPiece);
            if (idx > -1) {
                sortedPieces.splice(idx, 1);
                sortedPieces.push(selectedPiece);
            }
        }

        sortedPieces.forEach(piece => {
            if (!piece.imageData) return;

            const img = new Image();
            img.src = piece.imageData;

            // Draw the piece
            ctx.drawImage(
                img,
                piece.currentX, piece.currentY,
                piece.width, piece.height
            );

            // Draw outline
            ctx.strokeStyle = piece.isPlaced ?
                'rgba(76, 175, 80, 0.4)' :
                'rgba(255,255,255,0.08)';
            ctx.lineWidth = 1;
            drawPieceShape(ctx, piece.currentX, piece.currentY, piece.width, piece.height, piece.tabs);
            ctx.stroke();

            // Hint: show correct position outline
            if (hintMode && !piece.isPlaced) {
                ctx.strokeStyle = 'rgba(255, 107, 53, 0.25)';
                ctx.lineWidth = 2;
                ctx.setLineDash([6, 6]);
                drawPieceShape(ctx, piece.correctX, piece.correctY, piece.width, piece.height, piece.tabs);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // Highlight selected piece
            if (piece === selectedPiece && isDragging) {
                ctx.shadowColor = 'rgba(255, 107, 53, 0.5)';
                ctx.shadowBlur = 30;
                ctx.strokeStyle = '#ff6b35';
                ctx.lineWidth = 3;
                drawPieceShape(ctx, piece.currentX, piece.currentY, piece.width, piece.height, piece.tabs);
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
        });
    }

    // ================================================================
    // 🎲 SHUFFLE
    // ================================================================

    function shufflePiecesArray() {
        const W = canvas.width;
        const H = canvas.height;

        pieces.forEach(p => {
            const maxX = W - p.width;
            const maxY = H - p.height;
            p.currentX = Math.random() * maxX;
            p.currentY = Math.random() * maxY;
            p.isPlaced = false;
        });

        puzzleSolved = false;
        overlay.classList.remove('show');
        stopTimer();
        resetTimer();
        timerRunning = false;
        updateProgress();
        updatePiecesCount();
        drawPuzzle();
    }

    // ================================================================
    // ⏱️ TIMER
    // ================================================================

    function startTimer() {
        if (timerRunning) return;
        timerRunning = true;
        timerInterval = setInterval(() => {
            timerSeconds++;
            const m = Math.floor(timerSeconds / 60);
            const s = timerSeconds % 60;
            timerDisplay.textContent = m + ':' + String(s).padStart(2, '0');
        }, 1000);
    }

    function stopTimer() {
        timerRunning = false;
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    function resetTimer() {
        timerSeconds = 0;
        timerDisplay.textContent = '0:00';
    }

    // ================================================================
    // 📊 PROGRESS
    // ================================================================

    function updateProgress() {
        const placed = pieces.filter(p => p.isPlaced).length;
        const pct = Math.round((placed / TOTAL) * 100);
        progressFill.style.width = pct + '%';
        progressText.textContent = pct + '%';
        piecesCount.textContent = placed + '/' + TOTAL;
    }

    // ================================================================
    // 🖱️ DRAG & DROP
    // ================================================================

    function getPieceAt(x, y) {
        for (let i = pieces.length - 1; i >= 0; i--) {
            const p = pieces[i];
            if (p.isPlaced) continue;
            // Simple bounding box hit test (good enough for drag)
            if (x >= p.currentX && x <= p.currentX + p.width &&
                y >= p.currentY && y <= p.currentY + p.height) {
                return p;
            }
        }
        return null;
    }

    function onPointerDown(e) {
        if (puzzleSolved || !imageLoaded) return;

        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        const clientX = e.clientX || e.touches?.[0]?.clientX || 0;
        const clientY = e.clientY || e.touches?.[0]?.clientY || 0;

        const mx = (clientX - rect.left) * scaleX;
        const my = (clientY - rect.top) * scaleY;

        const piece = getPieceAt(mx, my);
        if (piece) {
            selectedPiece = piece;
            isDragging = true;
            dragOffX = mx - piece.currentX;
            dragOffY = my - piece.currentY;

            if (!timerRunning && !puzzleSolved) {
                startTimer();
            }

            drawPuzzle();
        }
    }

    function onPointerMove(e) {
        if (!isDragging || !selectedPiece || puzzleSolved) return;

        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;

        const clientX = e.clientX || e.touches?.[0]?.clientX || 0;
        const clientY = e.clientY || e.touches?.[0]?.clientY || 0;

        let mx = (clientX - rect.left) * scaleX;
        let my = (clientY - rect.top) * scaleY;

        selectedPiece.currentX = mx - dragOffX;
        selectedPiece.currentY = my - dragOffY;

        // Constrain
        selectedPiece.currentX = Math.max(0, Math.min(canvas.width - selectedPiece.width, selectedPiece.currentX));
        selectedPiece.currentY = Math.max(0, Math.min(canvas.height - selectedPiece.height, selectedPiece.currentY));

        drawPuzzle();
    }

    function onPointerUp(e) {
        if (isDragging && selectedPiece) {
            const p = selectedPiece;
            const threshold = 30;

            if (Math.abs(p.currentX - p.correctX) < threshold &&
                Math.abs(p.currentY - p.correctY) < threshold) {
                p.currentX = p.correctX;
                p.currentY = p.correctY;
                p.isPlaced = true;
                updateProgress();

                const placed = pieces.filter(pc => pc.isPlaced).length;
                if (placed === TOTAL) {
                    puzzleSolved = true;
                    stopTimer();
                    finalTime.textContent = timerDisplay.textContent;
                    overlay.classList.add('show');
                }
            }

            isDragging = false;
            selectedPiece = null;
            drawPuzzle();
        }
    }

    // ---- Events ----
    canvas.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); onPointerDown(e); }, { passive: false });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); onPointerMove(e); }, { passive: false });
    canvas.addEventListener('touchend', (e) => { e.preventDefault(); onPointerUp(e); }, { passive: false });

    // ================================================================
    // 🚀 INIT
    // ================================================================

    function loadImage(url) {
        return new Promise((resolve) => {
            const img = new Image();
            img.crossOrigin = 'Anonymous';
            img.onload = () => resolve(img);
            img.onerror = () => resolve(null);
            img.src = url;
        });
    }

    async function initPuzzle(imageUrl) {
        const img = await loadImage(imageUrl);
        if (!img) {
            alert('Failed to load image. Using fallback.');
            return;
        }

        puzzleImage = img;
        imageLoaded = true;

        pieces = generatePieces();
        renderPieceImages(img, pieces);

        // Randomize positions
        const W = canvas.width, H = canvas.height;
        pieces.forEach(p => {
            p.currentX = Math.random() * (W - p.width);
            p.currentY = Math.random() * (H - p.height);
            p.isPlaced = false;
        });

        puzzleSolved = false;
        overlay.classList.remove('show');
        stopTimer();
        resetTimer();
        timerRunning = false;
        updateProgress();
        drawPuzzle();
    }

    // ---- Public functions ----
    function shufflePieces() {
        if (puzzleSolved) overlay.classList.remove('show');
        shufflePiecesArray();
    }

    function toggleHint() {
        hintMode = !hintMode;
        drawPuzzle();
    }

    function resetPuzzle() {
        if (puzzleSolved) overlay.classList.remove('show');
        shufflePiecesArray();
    }

    function nextImage() {
        currentImgIdx = (currentImgIdx + 1) % IMAGES.length;
        initPuzzle(IMAGES[currentImgIdx]);
    }

    function sharePuzzle() {
        if (navigator.share) {
            navigator.share({ title: '🧩 Jigsaw Puzzle', url: window.location.href });
        } else {
            navigator.clipboard.writeText(window.location.href).then(() => {
                alert('Link copied!');
            }).catch(() => alert('Share: ' + window.location.href));
        }
    }

    function editPuzzle() {
        alert('To add your own images, edit the IMAGES array in the JavaScript code.');
    }

    // ---- Expose to HTML ----
    window.shufflePieces = shufflePieces;
    window.toggleHint = toggleHint;
    window.resetPuzzle = resetPuzzle;
    window.nextImage = nextImage;
    window.sharePuzzle = sharePuzzle;
    window.editPuzzle = editPuzzle;

    // ---- Start ----
    initPuzzle(IMAGES[0]);

    console.log('🧩 Real Jigsaw Puzzle loaded!');
    console.log('📸 Images:', IMAGES);
    console.log('🔢 Pieces:', TOTAL, '(', ROWS, 'x', COLS, ')');
</script>

</body>
</html>
