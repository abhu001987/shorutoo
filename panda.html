<!DOCTYPE html>
<html>
<head>
    <title>Simple Jigsaw</title>
    <style>
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .puzzle-container {
            background: #16213e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }
        #puzzleContainer {
            position: relative;
            width: 600px;
            height: 450px;
            margin: 0 auto;
            background: #2a2a4a;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #4a4a6a;
        }
        .piece {
            position: absolute;
            border: 1px solid rgba(255,255,255,0.3);
            cursor: grab;
            transition: box-shadow 0.2s;
        }
        .piece:hover {
            box-shadow: 0 0 15px rgba(255,107,53,0.5);
            z-index: 10;
        }
        .piece.selected {
            border: 3px solid #ff6b35;
            z-index: 20;
            box-shadow: 0 0 30px rgba(255,107,53,0.7);
        }
        button {
            padding: 10px 25px;
            background: #ff6b35;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 5px;
        }
        button:hover {
            background: #f7931e;
        }
        .status {
            color: #aaa;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="puzzle-container">
    <h2 style="color: white;">🧩 Jigsaw Puzzle</h2>
    <div id="puzzleContainer"></div>
    <div>
        <button onclick="shufflePieces()">🔀 Shuffle</button>
        <button onclick="resetPuzzle()">🔄 New Puzzle</button>
    </div>
    <div class="status" id="status">Drag pieces to solve!</div>
</div>

<script>
// Simple jigsaw implementation
let pieces = [];
let selectedPiece = null;
let offsetX, offsetY;
let rows = 4;
let cols = 6;
let container = document.getElementById('puzzleContainer');
let containerWidth = 600;
let containerHeight = 450;

// Load a random image
const imageUrl = 'https://picsum.photos/600/450?random=' + Date.now();

function createPuzzle() {
    // Clear container
    container.innerHTML = '';
    pieces = [];
    selectedPiece = null;
    
    const pieceWidth = containerWidth / cols;
    const pieceHeight = containerHeight / rows;
    
    // Create image
    const img = new Image();
    img.crossOrigin = 'Anonymous';
    img.src = imageUrl;
    
    img.onload = function() {
        // Create canvas to slice image
        const canvas = document.createElement('canvas');
        canvas.width = containerWidth;
        canvas.height = containerHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, containerWidth, containerHeight);
        
        // Create pieces
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const pieceCanvas = document.createElement('canvas');
                pieceCanvas.width = pieceWidth;
                pieceCanvas.height = pieceHeight;
                const pieceCtx = pieceCanvas.getContext('2d');
                
                pieceCtx.drawImage(canvas, 
                    c * pieceWidth, r * pieceHeight, pieceWidth, pieceHeight,
                    0, 0, pieceWidth, pieceHeight
                );
                
                const div = document.createElement('div');
                div.className = 'piece';
                div.style.width = pieceWidth + 'px';
                div.style.height = pieceHeight + 'px';
                div.style.backgroundImage = `url(${pieceCanvas.toDataURL()})`;
                div.style.backgroundSize = 'cover';
                div.dataset.row = r;
                div.dataset.col = c;
                div.dataset.correctX = c * pieceWidth;
                div.dataset.correctY = r * pieceHeight;
                
                // Random position
                const randomX = Math.random() * (containerWidth - pieceWidth);
                const randomY = Math.random() * (containerHeight - pieceHeight);
                div.style.left = randomX + 'px';
                div.style.top = randomY + 'px';
                
                // Drag events
                div.addEventListener('mousedown', startDrag);
                div.addEventListener('touchstart', startDragTouch);
                
                container.appendChild(div);
                pieces.push(div);
            }
        }
        
        document.getElementById('status').textContent = '🧩 Drag pieces to solve!';
        document.getElementById('status').style.color = '#aaa';
    };
}

// Drag handlers for mouse
function startDrag(e) {
    e.preventDefault();
    const piece = e.target;
    if (selectedPiece && selectedPiece !== piece) {
        selectedPiece.classList.remove('selected');
    }
    selectedPiece = piece;
    piece.classList.add('selected');
    
    const rect = piece.getBoundingClientRect();
    const containerRect = container.getBoundingClientRect();
    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;
    
    document.addEventListener('mousemove', onDrag);
    document.addEventListener('mouseup', endDrag);
}

function onDrag(e) {
    if (!selectedPiece) return;
    const containerRect = container.getBoundingClientRect();
    let x = e.clientX - containerRect.left - offsetX;
    let y = e.clientY - containerRect.top - offsetY;
    
    x = Math.max(0, Math.min(containerWidth - selectedPiece.offsetWidth, x));
    y = Math.max(0, Math.min(containerHeight - selectedPiece.offsetHeight, y));
    
    selectedPiece.style.left = x + 'px';
    selectedPiece.style.top = y + 'px';
}

function endDrag(e) {
    document.removeEventListener('mousemove', onDrag);
    document.removeEventListener('mouseup', endDrag);
    
    if (selectedPiece) {
        selectedPiece.classList.remove('selected');
        checkSnap(selectedPiece);
        selectedPiece = null;
    }
}

// Touch handlers
function startDragTouch(e) {
    e.preventDefault();
    const touch = e.touches[0];
    const piece = e.target;
    if (selectedPiece && selectedPiece !== piece) {
        selectedPiece.classList.remove('selected');
    }
    selectedPiece = piece;
    piece.classList.add('selected');
    
    const rect = piece.getBoundingClientRect();
    offsetX = touch.clientX - rect.left;
    offsetY = touch.clientY - rect.top;
    
    document.addEventListener('touchmove', onDragTouch);
    document.addEventListener('touchend', endDragTouch);
}

function onDragTouch(e) {
    e.preventDefault();
    if (!selectedPiece) return;
    const touch = e.touches[0];
    const containerRect = container.getBoundingClientRect();
    let x = touch.clientX - containerRect.left - offsetX;
    let y = touch.clientY - containerRect.top - offsetY;
    
    x = Math.max(0, Math.min(containerWidth - selectedPiece.offsetWidth, x));
    y = Math.max(0, Math.min(containerHeight - selectedPiece.offsetHeight, y));
    
    selectedPiece.style.left = x + 'px';
    selectedPiece.style.top = y + 'px';
}

function endDragTouch(e) {
    document.removeEventListener('touchmove', onDragTouch);
    document.removeEventListener('touchend', endDragTouch);
    
    if (selectedPiece) {
        selectedPiece.classList.remove('selected');
        checkSnap(selectedPiece);
        selectedPiece = null;
    }
}

function checkSnap(piece) {
    const correctX = parseInt(piece.dataset.correctX);
    const correctY = parseInt(piece.dataset.correctY);
    const currentX = parseInt(piece.style.left);
    const currentY = parseInt(piece.style.top);
    
    const threshold = 20;
    if (Math.abs(currentX - correctX) < threshold && Math.abs(currentY - correctY) < threshold) {
        piece.style.left = correctX + 'px';
        piece.style.top = correctY + 'px';
        piece.style.cursor = 'default';
        piece.style.borderColor = 'rgba(76, 175, 80, 0.5)';
        
        checkPuzzleSolved();
    }
}

function checkPuzzleSolved() {
    let solved = true;
    pieces.forEach(piece => {
        const correctX = parseInt(piece.dataset.correctX);
        const correctY = parseInt(piece.dataset.correctY);
        const currentX = parseInt(piece.style.left);
        const currentY = parseInt(piece.style.top);
        
        if (Math.abs(currentX - correctX) > 5 || Math.abs(currentY - correctY) > 5) {
            solved = false;
        }
    });
    
    if (solved) {
        document.getElementById('status').textContent = '🎉 Congratulations! Puzzle solved! 🎉';
        document.getElementById('status').style.color = '#4CAF50';
    }
}

function shufflePieces() {
    pieces.forEach(piece => {
        const x = Math.random() * (containerWidth - parseInt(piece.style.width));
        const y = Math.random() * (containerHeight - parseInt(piece.style.height));
        piece.style.left = x + 'px';
        piece.style.top = y + 'px';
        piece.style.borderColor = 'rgba(255,255,255,0.3)';
        piece.style.cursor = 'grab';
    });
    document.getElementById('status').textContent = '🔀 Pieces shuffled! Try again!';
    document.getElementById('status').style.color = '#aaa';
}

function resetPuzzle() {
    const img = new Image();
    img.crossOrigin = 'Anonymous';
    img.src = 'https://picsum.photos/600/450?random=' + Date.now();
    createPuzzle();
}

// Start the puzzle
window.onload = function() {
    createPuzzle();
};
</script>

</body>
</html>
