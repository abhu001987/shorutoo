<!DOCTYPE html>
<html>
<head>
    <title>My Headbreaker Puzzle</title>
</head>
<body>
    <div id="my-puzzle"></div>

    <!-- 1. Import the Headbreaker library -->
    <script src="https://flbulgarelli.github.io/headbreaker/js/headbreaker.js"></script>

    <script>
        // 2. Wait for the image to load
        let myImage = new Image();
        myImage.src = 'https://picsum.photos/800/600'; // <-- YOUR IMAGE HERE
        myImage.onload = () => {

            // 3. Create the puzzle canvas
            const canvas = new headbreaker.Canvas('my-puzzle', {
                width: 800,
                height: 600,
                image: myImage
            });

            // 4. Generate the puzzle pieces
            canvas.autogenerate();
            
            // 5. Shuffle and draw it!
            canvas.shuffle(0.7);
            canvas.draw();
        }
    </script>
</body>
</html>
