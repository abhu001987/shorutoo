<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Panda Galaxy Escape</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#030617;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial;
}

.game{

width:1200px;
height:500px;
position:relative;
overflow:hidden;
border-radius:18px;
border:3px solid #45ff9c;

background:url("https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=1600")
center/cover;

}

.game::before{

content:"";
position:absolute;
inset:0;
background:rgba(0,0,30,.45);

}

/* stars */

.star{

position:absolute;
width:3px;
height:3px;
background:white;
border-radius:50%;
animation:twinkle 2s infinite alternate;

}

@keyframes twinkle{

from{opacity:.2;}
to{opacity:1;}

}

/* panda */

.panda{

position:absolute;
left:180px;
bottom:60px;
font-size:90px;
animation:run .45s infinite alternate;
z-index:5;

}

/* dinosaur */

.dino{

position:absolute;
left:50px;
bottom:58px;
font-size:105px;
animation:run .45s infinite alternate;
z-index:4;

}

@keyframes run{

from{
transform:translateY(0px);
}

to{
transform:translateY(-8px);
}

}

/* ground */

.ground{

position:absolute;
bottom:0;
height:60px;
width:100%;
background:linear-gradient(to right,#0a5,#063);

}

/* score */

.score{

position:absolute;
top:20px;
left:20px;
color:white;
font-size:28px;
font-weight:bold;
z-index:10;

}

/* button */

.play{

position:absolute;
right:30px;
bottom:30px;
padding:18px 40px;
font-size:22px;
border:none;
border-radius:12px;
background:#6c5cff;
color:white;
cursor:pointer;
z-index:10;

}

.play:hover{

background:#8c7cff;

}

.title{

position:absolute;
top:20px;
right:30px;
font-size:34px;
color:white;
font-weight:bold;
z-index:10;

}

</style>
</head>

<body>

<div class="game">

<div class="score">
⭐ XP : 240
</div>

<div class="title">
🐼 Panda Galaxy Escape
</div>

<div class="dino">
🦖
</div>

<div class="panda">
🐼
</div>

<div class="ground"></div>

<button class="play">
▶ Start Game
</button>

</div>

<script>

const game=document.querySelector(".game");

for(let i=0;i<180;i++){

const star=document.createElement("div");

star.className="star";

star.style.left=Math.random()*1200+"px";
star.style.top=Math.random()*450+"px";
star.style.animationDelay=Math.random()*2+"s";

game.appendChild(star);

}

</script>

</body>
</html>
